name: Validate site
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_dashboard.py
      - run: git diff --exit-code -- '*.html'
      - run: python3 scripts/check_site.py
      - run: python3 scripts/test_research.py
      - run: python3 scripts/verify_official_snapshots.py
      - run: python3 scripts/compute_team_correlations.py && git diff --exit-code -- data/team-correlations-2025-26.csv
