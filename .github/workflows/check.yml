name: Research and dashboard checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: own7-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  research-static:
    name: Research and recursive site audit
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test statistical math, chronology, rights and eligibility
        run: python -m unittest discover -s tests -v
      - name: Reproduce NFL extraction from saved official text (refuses contradictions)
        run: python scripts/nfl_extract.py --check
      - name: Reproduce NFL origination and gates
        run: python -m nfl_origination run --check
      - name: Reproduce research, sources, blanks, all links and generated pages
        run: python scripts/check_site.py
      - name: Verify retained snapshots and parallel source contributions
        run: |
          python scripts/verify_official_snapshots.py
          python scripts/compute_team_correlations.py
          python scripts/test_research.py
          python handoff/f58e9526/compute_correlations.py --check
          python market-evidence/build.py --check
          python market-evidence/test_build.py -v
          python rental/build.py --check
          python rental/test_build.py -v
          python -m nfl_lab run --check
          python nfl/build.py --check
          python nfl/verify_independent.py
          python nfl/test_build.py -v
          python nfl/origination/originate.py --check
          python -m unittest discover -s nfl/origination -p "test_*.py" -v
          python nfl-assurance-9580ac3f/availability.py
          python nfl-results/extract.py
          python nfl-results/engine.py
          python -m unittest discover -s nfl-results/tests -v
          python nfl-availability-28ef/collect.py --check
          python nfl-availability-28ef/depth.py --check
          python nfl-availability-28ef/depletion.py --check
          python nfl-availability-28ef/build.py --check
          python -m unittest discover -s nfl-availability-28ef/tests -v
          python nfl-assurance-9580ac3f/build.py --check
          python nfl-assurance-9580ac3f/check.py --report
          python -m unittest discover -s nfl-assurance-9580ac3f/tests -v
      - name: Diagnose artifact freshness (non-failing)
        if: always()
        run: |
          echo "=== git status --porcelain ==="
          git status --porcelain | tee /tmp/status.txt
          echo "=== changed file list ==="
          git diff --name-status | tee /tmp/names.txt
          echo "=== per-file diff summary ==="
          git diff --stat | tee /tmp/stat.txt
          echo "=== first 120 changed lines ==="
          git diff | head -120
          echo "=== end diagnostic ==="
      - name: Committed artifacts must already be current
        run: git diff --exit-code
  browser:
    name: Desktop, mobile and accessibility
    needs: research-static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned browser test dependencies (no postinstall scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check client JavaScript syntax
        run: node --check js/app.js
      - name: Test every page at the GitHub project path
        run: npm run test:browser
      - name: Save browser evidence and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-browser-evidence
          path: .artifacts/
          retention-days: 7
